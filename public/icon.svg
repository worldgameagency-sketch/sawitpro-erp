<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  
  <!-- Outer Palm Leaf Fronds Arc -->
  <g fill="none" stroke="url(#leaf)" stroke-width="16" stroke-linecap="round">
    <path d="M 256 420 C 256 300 180 200 80 180" />
    <path d="M 256 420 C 256 300 332 200 432 180" />
    <path d="M 256 420 C 240 260 140 130 90 100" />
    <path d="M 256 420 C 272 260 372 130 422 100" />
    <path d="M 256 420 C 256 220 256 120 256 70" />
  </g>

  <!-- Palm Fruit Bunch (TBS) Stylized Silhouette -->
  <ellipse cx="256" cy="330" rx="90" ry="110" fill="url(#gold)" />
  <circle cx="210" cy="270" r="24" fill="#b45309" opacity="0.6" />
  <circle cx="260" cy="250" r="26" fill="#b45309" opacity="0.6" />
  <circle cx="305" cy="275" r="25" fill="#b45309" opacity="0.6" />
  <circle cx="215" cy="330" r="28" fill="#b45309" opacity="0.6" />
  <circle cx="260" cy="320" r="30" fill="#b45309" opacity="0.7" />
  <circle cx="305" cy="335" r="26" fill="#b45309" opacity="0.6" />
  <circle cx="230" cy="390" r="24" fill="#b45309" opacity="0.6" />
  <circle cx="280" cy="390" r="25" fill="#b45309" opacity="0.6" />

  <!-- App Badge Text or Emblem -->
  <circle cx="256" cy="330" r="42" fill="#14532d" />
  <path d="M 240 340 L 252 352 L 275 320" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
